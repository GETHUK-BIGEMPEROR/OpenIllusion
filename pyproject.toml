[build-system]
requires = ["setuptools>=69"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "openillusion"
dynamic = ["version"]
description = "Motion + Edit studio for Comfy: run on Comfy Router with an API key, or on your own GPU through Comfy API v2."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "httpx>=0.27",
  "av>=12",
  "pillow>=10",
  "pydantic>=2.6",
  "comfy-api-proxy>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy>=1.26"]

[project.scripts]
openillusion = "server.server:main"

[tool.setuptools.dynamic]
version = { attr = "server.__version__" }

[tool.setuptools.packages.find]
include = ["server*", "templates*", "schema*"]

[tool.setuptools.package-data]
server = ["static/**/*", "adapters/*.json"]
templates = ["local/*.json", "local/media/*", "cloud/*.json", "cloud/media/*"]
schema = ["*.json"]
