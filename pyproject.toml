[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openillusion"
dynamic = ["version"]
description = "Motion + Edit studio for Comfy: run on Comfy Router with an API key, or on your own GPU through Comfy API v2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "httpx>=0.27",
  "av>=12",
  "pillow>=10",
  "pydantic>=2.6",
  "comfy-api-proxy>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy>=1.26"]

[project.scripts]
openillusion = "openillusion.server:main"

[tool.setuptools.dynamic]
version = { attr = "openillusion.__version__" }

[tool.setuptools.packages.find]
include = ["openillusion*"]

[tool.setuptools.package-data]
openillusion = ["templates/local/*.json", "templates/local/media/*", "static/**/*", "starters/**/*"]
